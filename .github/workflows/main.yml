
name: ApexNet Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ApexNet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Verify project files
        run: |
          test -f backend/train.py
          test -f backend/model.py
          test -f backend/main.py
          test -f requirements.txt
          echo "Project files verified."

      - name: Verify core dependencies
        run: |
          python -c "import torch, pandas, sklearn, fastapi; print('Dependencies OK')"
